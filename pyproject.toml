[project]
name = "vubber"
version = "0.1.0"
description = "YouTube video dubbing pipeline"
readme = "README.md"
authors = [
    { name = "arpit", email = "arpit2003y@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "edge-tts",
    "faster-whisper",
    "ffmpeg-python",
    "groq",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    "yt-dlp",
]

[project.scripts]
vubber = "cli.app:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
namespace = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = []
extend-exclude = ["stubs"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cli", "config", "domain", "pipeline", "providers", "stages", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
include = ["cli", "config", "domain", "pipeline", "providers", "stages", "utils", "tests"]
stubPath = "stubs"
venvPath = "."
venv = ".venv"
